[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "giga-scientific-research"
version = "0.1.0"
description = "Deterministic, evidence-bound scientific acquisition and review pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
giga-scientific-evidence = "modules.research.core.scientific_evidence_cli:main"
giga-scientific-pipeline = "modules.research.core.scientific_pipeline_cli:main"
giga-scientific-campaign = "modules.research.scripts.run_scientific_campaign:main"
giga-elicit-campaign = "modules.research.scripts.run_elicit_campaign:main"
giga-analyze-evidence = "modules.research.scripts.analyze_skin_evidence:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["modules.research*", "modules.platform*"]
namespaces = true

[tool.setuptools.package-data]
"modules.research" = ["registry.v1.json"]
"modules.platform.contracts" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["modules/research/tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
